<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusrat Jahan Shanta</title>
</head>
<body>
    <h1 style="text-align: center;">Sign Up From</h1>
    <hr>
    <br>
    <label for="user"> Name</label>
    <input type="text" id="user" placeholder="User Name"><br>
    <label for="user"> Email</label>
    <input type="email" id="email" placeholder="User mail" required>
    <br>
    <label for="pass"> Password</label>
    <input type="password" id="pass" placeholder="password">
    <br>
    <label for="phn"> Phone</label>
    <br>
    <select name="code">
        <option value="+880">+880</option>
        <option value="+990">+990</option>
        <option value="+110">+110</option>
    </select>
    <input type="number" id="phn" name="phone" placeholder="123456789" required>
    <br>
    <label for="country">Country</label>
    <input list="con">
    <datalist id="con">
        <option value="Bangladesh"> Bangladesh</option>
        <option value="India"> India</option>
        <option value="Pakistan"> Pakistan</option>
        <option value="Canada"> Canada</option>
    </datalist>
    <br> 
    Gender
    <input type="radio" id="gnd" name="gender">
    <label for="gnd1"> Male</label>
    <input type="radio" id="gnd2" name="gender">
    <label for="gnd"> Female</label>
    <br>
    
    <label for="date"> Date Of Birth</label>
    <input type="date" id="date" name="dob">
    <br>
    <label for="time"> Time</label>
    <input type="time" id="time" name="tm">
    <br>
    <label for="colors"> Colors</label>
    <input type="color" id="colors" name="col">
    <br>
    <label for="file"> Choose Your Photo</label>
    <input type="file" id="file" name="fl">
    <br>
    <input type="checkbox" id="vehiclel" name="vec">
    <label for="vehiclel"> I Have a Bike</label>
    <input type="checkbox" id="vehiclel2" name="vec">
    <label for="vehiclel2"> I Have a Bycycle</label>
    <br>
    <textarea name="Comment" cols="30" rows="10"> Comment Here</textarea>


    <br>
    <input type="Submit" value="Send">
    <input type="reset" value="Reset">
    


</body>
</html>
